name: Run Trading Bot

on:
  workflow_dispatch:
    inputs:
      asset:
        description: 'Asset sou ekran an (egz: EURUSD-OTC)'
        required: true
        default: 'EURUSD-OTC'
      profit:
        description: 'Pwofi sou ekran an (egz: 85)'
        required: true
        default: '85'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Bot
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TARGET_ASSET: ${{ github.event.inputs.asset }}
        TARGET_PROFIT: ${{ github.event.inputs.profit }}
      run: |
        python bot.py
