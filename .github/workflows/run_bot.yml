
name: Romario Trader Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: romario-trader
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check required files
        run: |
          echo "Checking repository files..."
          ls -la
          test -f main.py || {
            echo "ERROR: main.py pa egziste nan repository a."
            exit 1
          }

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            echo "Pa gen requirements.txt."
          fi

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OTCHARTS_API_KEY: ${{ secrets.OTCHARTS_API_KEY }}
        run: python -u main.py

      - name: Save signal history
        if: success()
        run: |
          if [ -f last_signals.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add last_signals.json
            git diff --cached --quiet || \
              git commit -m "Update signal history"
            git push
          else
            echo "Pa gen last_signals.json pou sove."
          fi
